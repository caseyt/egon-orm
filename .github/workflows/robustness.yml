name: Robustness

# Step 21 (robustness): the long checks that do not run on pull requests. Started by hand
# (Actions > Robustness > Run workflow); the soak test also runs every Monday. Neither needs
# a secret.
#
# - soak: `pnpm test:soak`, a mixed workload against Postgres with random backend kills
#   through a pool of 5 (packages/postgres/test/soak); the report is kept as an artifact.
# - mutation: `pnpm test:mutation`, Stryker over packages/core changeset, query and compiler
#   (scripts/mutation.mjs); the HTML and JSON reports are kept as an artifact. Several hours.
on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options: [soak, mutation, both]
        default: soak
      soak-minutes:
        description: Length of the soak test, in minutes
        default: "30"
      mutation-areas:
        description: Areas to mutate (space-separated; empty for changeset, query and compiler)
        default: ""
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  soak:
    name: soak
    if: github.event_name == 'schedule' || inputs.check == 'soak' || inputs.check == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm db:up
      - run: pnpm test:soak
        env:
          EGON_SOAK_MINUTES: ${{ inputs.soak-minutes || '30' }}
          EGON_SOAK_REPORT: soak-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-report
          path: soak-report.json
          if-no-files-found: ignore
          retention-days: 30
      - if: failure()
        run: docker compose logs --no-color

  mutation:
    name: mutation
    if: github.event_name == 'workflow_dispatch' && (inputs.check == 'mutation' || inputs.check == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The areas are passed as separate words; scripts/mutation.mjs refuses unknown ones.
      - run: pnpm test:mutation $AREAS
        env:
          AREAS: ${{ inputs.mutation-areas }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 30
