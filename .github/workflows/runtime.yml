name: Runtime (Bun, best effort)

# Step 21 (robustness): the round trip of examples/runtime (an ES module, CommonJS through
# require(), and esbuild bundles of both) on Bun, against Postgres only (Bun cannot load
# better-sqlite3). Best effort: a failure is reported, not required. The Node 22 and 24 runs of
# the same matrix, and the Next.js app, are the runtime job in ci.yml, which the ci check requires.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bun:
    name: runtime (bun, best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm db:up
      - run: pnpm build
      # Pinned by SHA (v2.2.0) and Bun's version; npm's global install left no bun on PATH.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun --version
      # An ES module, CommonJS through require(), and the esbuild bundles of both, run on Bun.
      - run: pnpm --filter @egon-orm/example-runtime run check:bun
