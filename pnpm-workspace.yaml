packages:
  - "packages/*"
  - "benchmarks"
  - "examples/*"
  - "docs/site"
  - "docs/plan/spikes/kysely-bridge"

# Supply-chain policy. pnpm refuses releases younger than its minimum release age. Strict
# mode makes that an error; without it pnpm silently appends the package to
# `minimumReleaseAgeExclude` in this file. Never add an exclusion: pin the newest release
# that passes instead. scripts/check-workspace-policy.mjs (part of `pnpm lint`) enforces both.
minimumReleaseAgeStrict: true

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  # better-sqlite3 12 fetches (or builds) its native module in an install script.
  better-sqlite3: true
  esbuild: true
  # workerd (Cloudflare Workers runtime, for examples/edge-worker) installs its binary in one.
  workerd: true

patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
